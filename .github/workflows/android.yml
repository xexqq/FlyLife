name: Build FlyLife Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test deterministic world generation and navigation
        run: |
          mkdir -p /tmp/flylife-test
          javac -encoding UTF-8 -d /tmp/flylife-test app/src/main/java/com/flylife/game/WorldModel.java tools/WorldModelSmokeTest.java
          java -cp /tmp/flylife-test WorldModelSmokeTest
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlyLife-1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
